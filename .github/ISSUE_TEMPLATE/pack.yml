name: List a pack
description: A modpack for the index to list beside the ones it finds on its own, from a gist or a GitHub repository
title: 'List a pack'
labels: [pack]
body:
  - type: markdown
    attributes:
      value: |
        The index finds packs in repositories by their files, but nothing can search gists, which is where `ender export --gist` publishes one. Name yours here and it is read and listed within a few minutes.
  - type: input
    id: pack
    attributes:
      label: Pack
      description: A gist's link or gist:<id>, holding an ender.pack.json; or a GitHub repository's link, with an ender.pack.json or packwiz pack.toml at its root, or a .mrpack in its newest release
      placeholder: https://gist.github.com/you/0123456789abcdef0123456789abcdef
    validations:
      required: true
