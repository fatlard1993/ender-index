name: Rescan a mod
description: Read a mod's jars again with the newest scanner, when its findings were read by an older one
title: 'Rescan a mod'
labels: [rescan]
body:
  - type: markdown
    attributes:
      value: The index keeps each jar's findings from the scanner that first read it. This reads the mod's jars again with the newest one, within a few minutes.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its repository, as a link on GitHub, Codeberg or GitLab
    validations:
      required: true
