name: I want a built release of a mod
description: For a mod the index lists only by its source. The index asks its author for a release, and keeps the count on its note to them.
title: 'I want a built release of this mod'
labels: [interest, release]
body:
  - type: markdown
    attributes:
      value: |
        This mod has no release with a jar, so ender builds it from its source on your machine. Each player is counted once; the index asks its author for a release, and keeps that count up to date on its note.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
