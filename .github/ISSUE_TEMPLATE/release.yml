name: I want a built release of a mod
description: For a mod the index lists only by its source. When a few players ask, the index asks its author for a release.
title: 'I want a built release of this mod'
labels: [interest, release]
body:
  - type: markdown
    attributes:
      value: |
        This mod has no release with a jar, so ender builds it from its source on your machine. Each player is counted once; when a few have asked, the index asks its author, once, for a release.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
