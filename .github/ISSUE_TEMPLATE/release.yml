name: I want a built release of a mod
description: For a mod the index lists only by its source. The index counts each player once, and shows the count on the mod's page.
title: 'I want a built release of this mod'
labels: [interest, release]
body:
  - type: markdown
    attributes:
      value: |
        This mod has no release with a jar, so ender builds it from its source on your machine. Each player is counted once, and the count shows on the mod's page; when enough players have asked, the index reaches out to its author.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
