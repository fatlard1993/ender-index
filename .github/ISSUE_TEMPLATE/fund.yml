name: I would pay a mod's author
description: For a mod whose author the index knows no way to support. The index lets the author know, and keeps the count on its note to them.
title: 'I would pay this mod''s author'
labels: [interest, fund]
body:
  - type: markdown
    attributes:
      value: |
        The index found no FUNDING.yml and no support link for this mod. Each player is counted once; the index tells its author that players would pay them, and keeps that count up to date on its note.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
