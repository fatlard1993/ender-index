name: I would pay a mod's author
description: For a mod whose author the index knows no way to support. When a few players ask, the index lets the author know.
title: 'I would pay this mod''s author'
labels: [interest, fund]
body:
  - type: markdown
    attributes:
      value: |
        The index found no FUNDING.yml and no support link for this mod. Each player is counted once; when a few have asked, the index tells its author, once, that players would pay them.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
