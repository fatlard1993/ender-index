name: I would pay a mod's author
description: For a mod whose author the index knows no way to support. The index counts each player once, and shows the count on the mod's page.
title: 'I would pay this mod''s author'
labels: [interest, fund]
body:
  - type: markdown
    attributes:
      value: |
        The index found no FUNDING.yml and no support link for this mod. Each player is counted once, and the count shows on the mod's page; when enough players have asked, the index reaches out to its author.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as github:owner/repo
      placeholder: github:owner/repo
    validations:
      required: true
