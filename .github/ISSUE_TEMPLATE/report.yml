name: Report a jar or ask for a takedown
description: A jar that does harm, or something the index shows that should not be there
title: 'Report: '
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        The index's owner reads each report. A jar confirmed to do harm goes on the index's known-bad list: its page then says so in red, and ender refuses to install it. A repository can also be withheld from the index, as a takedown. If you are the mod's author and only want it out of the index, a topic on your repository does that without asking: see [Opting out](https://fatlard1993.github.io/ender-index/authors/opting-out).
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its page on the index, or its repository as a link
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What it is
      options:
        - 'A jar that does harm'
        - 'Something shown that should not be: a takedown'
        - 'A player shot that should come down'
    validations:
      required: true
  - type: input
    id: jar
    attributes:
      label: The jar
      description: For a jar that does harm, its release and file name, or its sha256 if you have it
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What it does or shows, and how you know; links to an analysis help
    validations:
      required: true
