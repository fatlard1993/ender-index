name: Share a shot
description: A screenshot from your game and the story behind it, for the index pages of the mods it shows
title: 'A shot of '
labels: [shot]
body:
  - type: markdown
    attributes:
      value: Every shot is looked over before it shows on the index. Share pictures you took yourself, in Minecraft.
  - type: textarea
    id: mods
    attributes:
      label: Mods it shows
      description: One to a line, each by its name, its mod id, or a link to it on the index or where its source lives
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: Picture
      description: Drag a screenshot in, or paste one. F2 in game saves one to the screenshots folder of its game directory.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: What happened, or what it shows
    validations:
      required: true
