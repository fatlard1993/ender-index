name: List a mod
description: A mod for the index to list now, rather than when its nightly discovery finds it
title: 'List a mod'
labels: [mod]
body:
  - type: markdown
    attributes:
      value: |
        The index finds mods by their metadata and topics, which can take a few nights. Name yours here and it is crawled and listed within a few minutes, then read with every crawl after.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: The repository's link on GitHub, Codeberg or GitLab, or owner/repo for GitHub. Its newest release needs a Fabric, Quilt, Forge or NeoForge jar.
      placeholder: https://github.com/you/your-mod
    validations:
      required: true
