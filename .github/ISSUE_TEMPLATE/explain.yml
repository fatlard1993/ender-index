name: Explain a finding
description: For a mod's author, a word on what the index found its code can reach, shown beside the finding as yours
title: 'Explain a finding'
labels: [explain]
body:
  - type: markdown
    attributes:
      value: |
        The index scans each jar for what its code can reach beyond the game, and shows that on the mod's page as a finding. Changing the mod so a finding goes away answers it one way; this answers it another, in your own words beside it. [What each finding means](https://fatlard1993.github.io/ender-index/findings), and what grants it, is on the index.

        Only the mod's author can explain its findings: this issue has to come from the GitHub account that owns the repository, or one that made at least half its commits. The index looks each one over before it shows. It shows labelled as yours, with the release it was written for, so players know the index has not checked it. Changed words are looked over again; empty the explanation to take it down at once.
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Its repository on GitHub, as a link or owner/repo
    validations:
      required: true
  - type: dropdown
    id: finding
    attributes:
      label: Finding
      description: One finding to an issue
      options:
        - 'network: its code can open network connections'
        - 'exec: its code can start other programs'
        - 'native: its code can load native libraries'
        - 'unsafe: its code uses Unsafe'
        - 'classloading: its code can define classes while running'
        - 'webhook: its code names a chat webhook'
        - "session: its code reads Minecraft's session token or a launcher's accounts"
        - 'persistence: its code names a place that starts programs with the computer'
        - 'clipboard: its code reads or writes the clipboard'
        - 'hidden: it holds a jar or class under another name'
        - 'secrets: its code names where other programs keep logins'
        - 'hosts: the hosts its strings name'
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: The finding is
      description: A finding that is wrong is a check for the index to refine, so say so here
      options:
        - 'Right, and this says why'
        - 'Wrong: the code does not do this'
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: What the code does with it, and why. Plain text, up to 1000 characters.
