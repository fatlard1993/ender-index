name: crawl

on:
  # Four crawls a day, six hours apart: the crawl spends the token's hourly limit, which refills each hour, so each
  # run's four hours go as far as one night's did, and the hours between leave the token's owner all of it. Only the
  # first discovers
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
    - cron: '17 16 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: Search for new mod repositories before crawling, as the first scheduled crawl of each day does
        type: boolean
        default: true

permissions:
  contents: write

concurrency: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The crawl's own budget is 240 minutes, after a discovery of up to forty and a source check of up to twenty; a job
    # the runner stops commits nothing
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - uses: actions/cache/restore@v4
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      - name: discover
        if: inputs.discover || github.event.schedule == '17 4 * * *'
        run: bun run discover
        working-directory: ender-index
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
      # Every repository with no record looked at for a jar over GraphQL, so the crawl spends no REST request on those
      # with none; discovery does this itself
      - name: triage
        if: ${{ !(inputs.discover || github.event.schedule == '17 4 * * *') }}
        run: bun src/triage.js
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          TRIAGE_MINUTES: 20
      # The repositories found with no release, looked at for a source that builds; each is due weekly or monthly
      - name: sources
        run: bun run sources
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
      # Under the job's limit, so a crawl that overruns its budget is stopped here and the lists and commit below still run
      - name: crawl
        id: crawl
        run: bun run crawl
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 300
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          # A personal token's hour is all of its owner's tools'; the crawl leaves them this much of it
          CRAWL_RESERVE: ${{ secrets.CRAWL_TOKEN && '1000' || '0' }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CRAWL_MINUTES: 240
      # Again from what is on disk: a crawl stopped by its step's limit wrote records but never listed them
      - name: lists
        if: always() && steps.crawl.outcome != 'success'
        run: bun run lists
        working-directory: ender-index
        timeout-minutes: 20
      - name: commit
        if: always()
        working-directory: ender-index
        run: |
          git config user.name 'ender-index'
          git config user.email 'ender-index@users.noreply.github.com'
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Crawl $(date -u +%F)"
          # A pack listed while the crawl ran rebuilt the same lists: the crawl's records win, and the lists are built
          # again from both
          git pull --rebase -X theirs
          bun run lists
          git add data
          git diff --cached --quiet || git commit --amend --no-edit
          git push
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
      - name: report a failed crawl
        if: steps.crawl.outcome == 'failure'
        run: exit 1
