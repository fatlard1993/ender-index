name: crawl

on:
  # Each crawl starts the next as it ends, since GitHub runs a schedule hours late or not at all; the schedule restarts
  # the chain should a crawl not get as far as starting it. Each spends the App's hourly limit and commits it, so a
  # crawl lost costs an hour. Only the 04:17 crawl discovers
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 0-3,5-23 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: Search for new mod repositories before crawling, as the first scheduled crawl of each day does
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The crawl's own budget is 45 minutes, after a discovery of up to forty and a source check of up to twenty; a job
    # the runner stops commits nothing
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
          ref: main
      # The data lives on its own branch, its history replaced nightly (data-squash.yml), and is checked out where the
      # code reads it
      - uses: actions/checkout@v4
        with:
          path: ender-index/data
          ref: data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - uses: actions/cache/restore@v4
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      # Held to its share of the job's time, which an overrun would take from the crawl and then from the next start
      - name: discover
        id: discover
        if: inputs.discover || github.event.schedule == '17 4 * * *'
        run: exec bun src/discover.js
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          CRAWL_APP_ID: ${{ vars.CRAWL_APP_ID }}
          CRAWL_APP_KEY: ${{ secrets.CRAWL_APP_KEY }}
      # Every repository with no record looked at for a jar over GraphQL, so the crawl spends no REST request on those
      # with none; discovery does this itself
      - name: triage
        id: triage
        if: ${{ !(inputs.discover || github.event.schedule == '17 4 * * *') }}
        run: exec bun src/triage.js
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          CRAWL_APP_ID: ${{ vars.CRAWL_APP_ID }}
          CRAWL_APP_KEY: ${{ secrets.CRAWL_APP_KEY }}
          TRIAGE_MINUTES: 10
      # The repositories found with no release, looked at for a source that builds; each is due weekly or monthly
      - name: sources
        id: sources
        run: exec bun src/sources.js
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          CRAWL_APP_ID: ${{ vars.CRAWL_APP_ID }}
          CRAWL_APP_KEY: ${{ secrets.CRAWL_APP_KEY }}
      # Under the job's limit, so a crawl that overruns its budget is stopped here and the lists and commit below still run
      - name: crawl
        id: crawl
        run: exec bun src/crawl.js
        working-directory: ender-index
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          CRAWL_APP_ID: ${{ vars.CRAWL_APP_ID }}
          CRAWL_APP_KEY: ${{ secrets.CRAWL_APP_KEY }}
          # A personal token's hour is all of its owner's tools'; the crawl leaves them this much of it. The App's is
          # the crawl's alone
          CRAWL_RESERVE: ${{ !vars.CRAWL_APP_ID && secrets.CRAWL_TOKEN && '1000' || '0' }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CRAWL_MINUTES: 45
          # Unset, old findings stand. Set the RESCAN variable to full or throttled to read again what an older scanner
          # read, and remove it once done
          CRAWL_RESCAN: ${{ vars.RESCAN }}
      # A step's time limit stops its shell, and each runs its script with exec so the script is what stops; this makes
      # sure nothing is left writing records while they are listed and committed
      - name: stop what a timed-out step left running
        if: always()
        run: |
          pgrep -af '^bun src/(discover|triage|sources|crawl)\.js' || exit 0
          pkill -f '^bun src/(discover|triage|sources|crawl)\.js'
          sleep 5
      # Again from what is on disk: a crawl stopped by its step's limit wrote records but never listed them
      - name: lists
        if: always() && steps.crawl.outcome != 'success'
        run: exec bun src/lists.js
        working-directory: ender-index
        timeout-minutes: 20
      - name: commit
        if: always()
        working-directory: ender-index
        run: |
          # A pack listed while the crawl ran rebuilt the same lists: the crawl's records win, and the lists are built
          # again from both
          scripts/data-push "Crawl $(date -u +%F)" --relist
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
      # Not after a cancelled run, so cancelling one stops the chain; a step that ran out of its own time still starts
      # the next. The one started in the 04:00 UTC hour discovers, as the schedule's 04:17 crawl is as often skipped
      - name: start the next crawl
        if: ${{ !cancelled() && steps.crawl.outcome != 'skipped' }}
        run: gh workflow run crawl.yml --repo ${{ github.repository }} --ref main -f discover=$([ "$(date -u +%H)" = 04 ] && echo true || echo false)
        env:
          GH_TOKEN: ${{ github.token }}
      # What was committed, held to the schemas launchers build on; a crawl's push starts no CI, so it is checked here
      - name: schemas
        id: schemas
        if: ${{ !cancelled() && steps.crawl.outcome != 'skipped' }}
        continue-on-error: true
        working-directory: ender-index
        timeout-minutes: 10
        run: exec bun test ./test/schema.test.js
      # Last, after the commit and the next crawl's start: each step before runs on past a failure, so its failure is
      # said here, and the run fails so it is seen
      - name: report a failed step
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: discover=${{ steps.discover.outcome }} triage=${{ steps.triage.outcome }} sources=${{ steps.sources.outcome }} crawl=${{ steps.crawl.outcome }} schemas=${{ steps.schemas.outcome }}
        run: |
          failed=$(printf '%s\n' $OUTCOMES | { grep '=failure$' || true; } | cut -d= -f1 | tr '\n' ' ')
          [ -z "$failed" ] && exit 0
          echo "::error::These steps failed, and the crawl went on past them: $failed"
          exit 1
