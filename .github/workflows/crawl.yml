name: crawl

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: Search for new mod repositories before crawling
        type: boolean
        default: false

permissions:
  contents: write

concurrency: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The crawl's own budget is 240 minutes, after a discovery of up to forty; a job the runner stops commits nothing
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - uses: actions/cache/restore@v4
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      - name: discover
        if: inputs.discover || github.event_name == 'schedule'
        run: |
          if [ '${{ inputs.discover }}' = true ] || [ "$(date -u +%u)" = 7 ]; then bun run discover; else echo 'Discovery runs on Sundays'; fi
        working-directory: ender-index
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: crawl
        id: crawl
        run: bun run crawl
        working-directory: ender-index
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWL_TOKEN || secrets.GITHUB_TOKEN }}
          # A personal token's hour is all of its owner's tools'; the crawl leaves them this much of it
          CRAWL_RESERVE: ${{ secrets.CRAWL_TOKEN && '1000' || '0' }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CRAWL_MINUTES: 240
      - name: commit
        if: always()
        working-directory: ender-index
        run: |
          git config user.name 'ender-index'
          git config user.email 'ender-index@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Crawl $(date -u +%F)"
          git pull --rebase
          git push
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ender-index/.cache
          key: crawl-${{ github.run_id }}
      - name: report a failed crawl
        if: steps.crawl.outcome == 'failure'
        run: exit 1
