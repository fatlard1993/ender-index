# vbc's shared CI (templates/ci.yml), run beside the ender-launcher checkout the index depends on by path. It has no
# .lld.md documents, so the lld steps are left out.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: checkout persists it into .git/config, and the next steps run the branch's own scripts
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
          persist-credentials: false
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install --frozen-lockfile
        working-directory: ender-index
      - run: bun run lint
        working-directory: ender-index
      - run: bun test
        working-directory: ender-index
      - run: bun run build:site
        working-directory: ender-index
