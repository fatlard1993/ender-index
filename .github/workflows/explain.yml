name: explain

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

# One group per issue, as for listing a mod: runs for different issues meet at the push, which retries from the newest
concurrency: explain-${{ github.event.issue.number }}

jobs:
  explain:
    # An edit to a closed issue counts too: that is how an author changes or takes down what shows. Of labels, only
    # those that publish an explanation or take it down
    if: >-
      (contains(github.event.issue.labels.*.name, 'explain') || github.event.issue.title == 'Explain a finding') && (github.event.action != 'labeled' || github.event.label.name == 'approved' || github.event.label.name == 'withdrawn')

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install --frozen-lockfile
        working-directory: ender-index
      - name: explain
        working-directory: ender-index
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLAIN_EVENT: ${{ toJSON(github.event.issue) }}
          EXPLAIN_ISSUE: ${{ github.event.issue.number }}
          EXPLAIN_STATE: ${{ github.event.issue.state }}
          EXPLAIN_ACTION: ${{ github.event.action }}
          EXPLAIN_LABEL: ${{ github.event.label.name }}
          SUBMIT_SAY: ${{ runner.temp }}/say.md
          EXPLAIN_FLAGS: ${{ runner.temp }}/flags
        run: |
          git config user.name 'ender-index'
          git config user.email 'ender-index@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            code=0
            bun src/explain.js || code=$?
            [ "$code" = 0 ] || [ "$code" = 3 ] || break
            git add data/explanations.json
            git diff --cached --quiet && break
            git commit -qm "Explanations: from #$EXPLAIN_ISSUE"
            git push -q && break
            code=1
          done
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then
            gh issue comment "$EXPLAIN_ISSUE" --body 'The index could not read this just now; it is looked into from the failed run.'
            exit 1
          fi
          grep -qx review "$EXPLAIN_FLAGS" && gh issue edit "$EXPLAIN_ISSUE" --remove-label approved
          grep -qx refine "$EXPLAIN_FLAGS" && gh issue edit "$EXPLAIN_ISSUE" --add-label refine
          [ -s "$SUBMIT_SAY" ] && gh issue comment "$EXPLAIN_ISSUE" --body-file "$SUBMIT_SAY"
          [ "$code" = 0 ] && [ "$EXPLAIN_STATE" = open ] && gh issue close "$EXPLAIN_ISSUE" --reason completed
          exit 0
