name: interest

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency: interest

jobs:
  count:
    if: contains(github.event.issue.labels.*.name, 'interest') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - name: count
        working-directory: ender-index
        env:
          GH_TOKEN: ${{ github.token }}
          INTEREST_BODY: ${{ github.event.issue.body }}
          INTEREST_KIND: ${{ contains(github.event.issue.labels.*.name, 'fund') && 'fund' || 'release' }}
          INTEREST_LOGIN: ${{ github.event.issue.user.login }}
          INTEREST_ISSUE: ${{ github.event.issue.number }}
          INTEREST_SAY: ${{ runner.temp }}/say.md
          NOTICE_FILE: ${{ runner.temp }}/notice.json
          # Until this is live, a notice due is posted here as a draft to read, never on the author's repository
          NOTICES: ${{ vars.NOTICES || 'draft' }}
          NOTICE_TOKEN: ${{ secrets.NOTICE_TOKEN }}
        run: |
          git config user.name 'ender-index'
          git config user.email 'ender-index@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -f "$NOTICE_FILE"
            code=0
            bun src/interest.js || code=$?
            [ "$code" = 0 ] || break
            git add data
            git diff --cached --quiet && break
            git commit -qm "Interest: counted from #$INTEREST_ISSUE"
            git push -q && break
            code=1
          done
          if [ "$code" = 1 ] || [ ! -s "$INTEREST_SAY" ]; then
            gh issue comment "$INTEREST_ISSUE" --body 'The index could not count this just now; it is looked into from the failed run.'
            exit 1
          fi
          gh issue comment "$INTEREST_ISSUE" --body-file "$INTEREST_SAY"
          [ "$code" = 0 ] && gh issue close "$INTEREST_ISSUE" --reason completed
          [ -s "$NOTICE_FILE" ] || exit 0
          title=$(jq -r .title "$NOTICE_FILE")
          jq -r .body "$NOTICE_FILE" > "$RUNNER_TEMP/notice.md"
          host=$(jq -r .repo.host "$NOTICE_FILE")
          repo=$(jq -r .repo.name "$NOTICE_FILE")
          if [ "$NOTICES" = live ] && [ "$host" = github ]; then
            GH_TOKEN="$NOTICE_TOKEN" gh issue create -R "$repo" --title "$title" --body-file "$RUNNER_TEMP/notice.md"
          else
            gh label create notice-draft --color BFD4F2 --description 'A notice to an author, posted here to read first' 2>/dev/null || true
            gh issue create --label notice-draft --title "Draft for $host:$repo: $title" --body-file "$RUNNER_TEMP/notice.md"
          fi
