name: interest

on:
  issues:
    types: [opened, edited, reopened]
  # Each run counts every open ask, so one GitHub cancels while it waits behind another is counted by the next
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: interest

jobs:
  count:
    # By label from the form; by title from ender, as GitHub drops the labels of an issue opened through its API by
    # anyone who cannot triage this repository
    if: >-
      github.event_name != 'issues' || (github.event.issue.state == 'open' && (contains(github.event.issue.labels.*.name, 'interest') || github.event.issue.title == 'I would pay this mod''s author' || github.event.issue.title == 'I want a built release of this mod'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
      # The data lives on its own branch, its history replaced nightly (data-squash.yml), and is checked out where the
      # code reads it
      - uses: actions/checkout@v4
        with:
          path: ender-index/data
          ref: data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - name: count, and post or update each notice
        id: count
        working-directory: ender-index
        env:
          GH_TOKEN: ${{ github.token }}
          INTEREST_REPLIES: ${{ runner.temp }}/replies.json
          # The index counts asks and its owner reaches out to authors; set the NOTICES repository variable to draft to
          # have each notice drafted here first. Nothing is posted on an author's repository
          NOTICES: ${{ vars.NOTICES }}
        run: |
          gh label create notice-draft --color BFD4F2 --description 'A notice to an author, posted here to read first' 2>/dev/null || true
          code=0
          bun src/interest.js count || code=$?
          [ "$code" = 0 ] || [ "$code" = 2 ] || exit "$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: keep the counts
        working-directory: ender-index
        run: |
          scripts/data-push 'Interest: counted the open asks'
      - name: answer and close each ask
        working-directory: ender-index
        env:
          GH_TOKEN: ${{ github.token }}
          INTEREST_REPLIES: ${{ runner.temp }}/replies.json
        run: bun src/interest.js reply
      - name: say a notice failed
        if: steps.count.outputs.code == '2'
        run: |
          echo "::error::A notice could not be posted; the count step's log says which and why"
          exit 1
