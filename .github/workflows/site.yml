name: site

on:
  push:
    branches: [main]
    paths: [client/**, scripts/buildSite.js, package.json, bun.lock, .github/workflows/site.yml]
  # The ranking is ender-launcher's, bundled at build time; a daily build takes up its changes
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
        working-directory: ender-index
      - run: bun run build:site
        working-directory: ender-index
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ender-index/client/build
      - id: deployment
        uses: actions/deploy-pages@v4
