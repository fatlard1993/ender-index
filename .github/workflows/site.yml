name: site

on:
  push:
    branches: [main]
    paths: [client/**, scripts/buildSite.js, package.json, bun.lock, .github/workflows/site.yml]
  # The ranking is ender-launcher's, bundled at build time; a daily build takes up its changes
  schedule:
    - cron: '47 3 * * *'
  # Each mod has a page of its own, and the listing is copied beside them, so every crawl starts a build once it has
  # committed (crawl.yml); a workflow_run trigger missed the crawls a crawl started itself
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ender-index
      # The data lives on its own branch, its history replaced nightly (data-squash.yml), and is checked out where the
      # code reads it
      - uses: actions/checkout@v4
        with:
          path: ender-index/data
          ref: data
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: fatlard1993/ender-launcher
          path: ender-launcher
      # By its download address: asked for by version, setup-bun asks GitHub's API where it is, which a crawl running
      # alongside may have spent the repository's hour of
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
      - run: bun install
        working-directory: ender-index
      - run: bun run build:site --pages https://fatlard1993.github.io/ender-index/
        working-directory: ender-index
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ender-index/client/build
      - id: deployment
        uses: actions/deploy-pages@v4
