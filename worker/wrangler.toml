name = "ender-shots"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
QUEUE = "fatlard1993/ender-shots"
ORIGINS = "https://fatlard1993.github.io,http://localhost:7460"

# Per sender's address: Turnstile stops scripts, this stops a person with a folder of pictures
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Set with `wrangler secret put`: GITHUB_TOKEN, which can write ender-shots and nothing else, and TURNSTILE_SECRET
